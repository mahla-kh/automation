events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    upstream php-fpm {
        server app:9000;
    }

    server {
        listen 4000;
        server_name localhost;

        # Static frontend root
        root /var/www/frontend/out;
        index index.html;

        # HTML page routing for static export
        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }

        location /tohtml {
            try_files $uri $uri.html /tohtml/index.html /tohtml.html /index.html;
        }

        # Laravel API reverse proxy
        location /api/ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 180s;
        }

        # Healthcheck endpoint
        location /up {
            fastcgi_pass php-fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param PATH_INFO /up;
        }
    }
}
