[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:queue-drive]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/backend/artisan queue:work database --queue=drive-ocr --timeout=1500 --tries=1 --sleep=3 --max-time=3600
autostart=true
autorestart=true
numprocs=1
stopwaitsecs=1600
redirect_stderr=true
stdout_logfile=/var/www/backend/storage/logs/worker-drive.log

[program:queue-deepseek]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/backend/artisan queue:work database --queue=deepseek --timeout=900 --tries=1 --sleep=3 --max-time=3600
autostart=true
autorestart=true
numprocs=2
stopwaitsecs=950
redirect_stderr=true
stdout_logfile=/var/www/backend/storage/logs/worker-deepseek.log
