services:
  nginx:
    image: nginx:alpine
    ports:
      - "4000:4000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/out:/var/www/frontend/out:ro
      - ../backend:/var/www/backend:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../backend:/var/www/backend
      - ../outputs:/var/www/backend/storage/app/outputs
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wepass_automation}
      DB_USERNAME: ${DB_USERNAME:-wepass}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-drive:
    build:
      context: .
      dockerfile: Dockerfile
    command: php /var/www/backend/artisan queue:work database --queue=drive-ocr --timeout=1500 --tries=1 --sleep=3 --max-time=3600
    volumes:
      - ../backend:/var/www/backend
      - ../outputs:/var/www/backend/storage/app/outputs
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wepass_automation}
      DB_USERNAME: ${DB_USERNAME:-wepass}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker-deepseek:
    build:
      context: .
      dockerfile: Dockerfile
    command: php /var/www/backend/artisan queue:work database --queue=deepseek --timeout=900 --tries=1 --sleep=3 --max-time=3600
    volumes:
      - ../backend:/var/www/backend
      - ../outputs:/var/www/backend/storage/app/outputs
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wepass_automation}
      DB_USERNAME: ${DB_USERNAME:-wepass}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "while true; do php /var/www/backend/artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - ../backend:/var/www/backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wepass_automation}
      DB_USERNAME: ${DB_USERNAME:-wepass}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wepass_automation}
      POSTGRES_USER: ${DB_USERNAME:-wepass}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wepass} -d ${DB_DATABASE:-wepass_automation}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
